name: Unsigned IPA

# Builds an Ouispr .ipa for sideloading (AltStore re-signs it with a free
# Apple ID on the iPhone). Runs on every push to main, or by hand.
on:
  push:
    branches: [main]
  # Also on pull requests, so a change to this pipeline is proven before it
  # reaches main. Only main publishes the release (see the last step).
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same toolchain as ci.yml (see the comment there for why 26.4.1).
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Install xcbeautify (if missing)
        run: |
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify
          fi

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-fa015-${{ runner.os }}-${{ hashFiles('Ouispr.xcodeproj/project.pbxproj', 'OuisprCore/Package.swift') }}
          restore-keys: |
            spm-fa015-${{ runner.os }}-

      - name: Resolve SwiftPM dependencies
        run: |
          # Pinned: fails instead of silently moving to a newer version than the
          # committed Package.resolved.
          xcodebuild -resolvePackageDependencies \
            -project Ouispr.xcodeproj \
            -scheme OuisprApp \
            -onlyUsePackageVersionsFromResolvedFile

      # Device build without signing: AltStore signs it on the phone.
      - name: Build OuisprApp for iPhone (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ouispr.xcodeproj \
            -scheme OuisprApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            | xcbeautify --renderer github-actions

      # AltStore reads the entitlements from the binaries' signature to know
      # which App Group to grant. An unsigned build carries none, so the app and
      # the keyboard would end up in two separate sandboxes. An ad-hoc signature
      # (no certificate needed) embeds them; AltStore replaces it on install.
      - name: Embed entitlements (ad-hoc signature)
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release-iphoneos/OuisprApp.app
          sign_nested_code() {
            find "$1" -maxdepth 2 \( -name '*.framework' -o -name '*.dylib' \) -path '*/Frameworks/*' -print0 |
              while IFS= read -r -d '' f; do codesign -f -s - "$f"; done
          }
          for EXT in "$APP"/PlugIns/*.appex "$APP"/Extensions/*.appex; do
            [ -d "$EXT" ] || continue
            NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT/Info.plist")
            sign_nested_code "$EXT"
            codesign -f -s - --entitlements "$NAME/$NAME.entitlements" "$EXT"
          done
          sign_nested_code "$APP"
          codesign -f -s - --entitlements OuisprApp/OuisprApp.entitlements "$APP"
          for B in "$APP" "$APP"/PlugIns/*.appex "$APP"/Extensions/*.appex; do
            [ -d "$B" ] || continue
            echo "== $B"
            codesign -d --entitlements - --xml "$B" 2>/dev/null | grep -q 'group.solutions.pivi.dictus' \
              || { echo "::error::No App Group entitlement in $B"; exit 1; }
          done

      - name: Package Ouispr.ipa
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release-iphoneos/OuisprApp.app
          test -d "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../Ouispr.ipa Payload)
          ls -lh Ouispr.ipa

      - name: Upload Ouispr.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Ouispr-ipa
          path: Ouispr.ipa
          retention-days: 30

      # "Ouispr Beta": the same code under its own name, icon, identifiers and App
      # Group, so it installs NEXT TO Ouispr and shares no data with it (see
      # scripts/apply-beta-variant.py and OuisprVariant.swift). It is how a pull
      # request is tried on the iPhone without replacing the app that works, so it is
      # built for pull requests and manual runs only, never published as a release.
      # It reuses the build above: only what the new identifiers touch is redone.
      - name: Build Ouispr Beta for iPhone (Release, unsigned)
        if: github.event_name != 'push'
        run: |
          set -eo pipefail
          python3 scripts/apply-beta-variant.py
          # The bundle above carries the everyday identifiers and an ad-hoc signature.
          rm -rf build/DerivedData/Build/Products/Release-iphoneos/OuisprApp.app
          xcodebuild build \
            -project Ouispr.xcodeproj \
            -scheme OuisprApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            | xcbeautify --renderer github-actions

      # The Beta ships the app and the keyboard only. A free Apple ID may register
      # 10 identifiers a week and every extension costs one; the share sheet and the
      # widgets are not what the Beta is for, and the widgets' links open "ouispr://",
      # which belongs to the everyday app.
      - name: Package OuisprBeta.ipa (app and keyboard only)
        if: github.event_name != 'push'
        run: |
          set -euo pipefail
          APP=build/DerivedData/Build/Products/Release-iphoneos/OuisprApp.app
          test -d "$APP"
          rm -rf "$APP/PlugIns/OuisprShare.appex" "$APP/PlugIns/OuisprWidgets.appex" \
                 "$APP/Extensions/OuisprShare.appex" "$APP/Extensions/OuisprWidgets.appex"
          KEYBOARD="$APP/PlugIns/OuisprKeyboard.appex"
          test -d "$KEYBOARD"
          REMAINING=$(find "$APP" -name '*.appex' | wc -l | tr -d ' ')
          [ "$REMAINING" = "1" ] || { echo "::error::Expected the keyboard only, found $REMAINING extensions"; exit 1; }

          expect() { # expect <plist> <key> <value>
            local found
            found=$(/usr/libexec/PlistBuddy -c "Print :$2" "$1")
            [ "$found" = "$3" ] || { echo "::error::$1 $2 is '$found', expected '$3'"; exit 1; }
          }
          expect "$APP/Info.plist" CFBundleIdentifier com.pivi.ouisprbeta
          expect "$APP/Info.plist" CFBundleDisplayName "Ouispr Beta"
          expect "$APP/Info.plist" CFBundleURLTypes:0:CFBundleURLSchemes:0 ouisprbeta
          expect "$KEYBOARD/Info.plist" CFBundleIdentifier com.pivi.ouisprbeta.keyboard
          expect "$KEYBOARD/Info.plist" CFBundleDisplayName "Ouispr Beta"

          sign_nested_code() {
            find "$1" -maxdepth 2 \( -name '*.framework' -o -name '*.dylib' \) -path '*/Frameworks/*' -print0 |
              while IFS= read -r -d '' f; do codesign -f -s - "$f"; done
          }
          sign_nested_code "$KEYBOARD"
          codesign -f -s - --entitlements OuisprKeyboard/OuisprKeyboard.entitlements "$KEYBOARD"
          sign_nested_code "$APP"
          codesign -f -s - --entitlements OuisprApp/OuisprApp.entitlements "$APP"
          for B in "$APP" "$KEYBOARD"; do
            ENTITLEMENTS_XML=$(codesign -d --entitlements - --xml "$B" 2>/dev/null)
            grep -q '<string>group.solutions.pivi.ouisprbeta</string>' <<<"$ENTITLEMENTS_XML" \
              || { echo "::error::No Beta App Group entitlement in $B"; exit 1; }
            if grep -q '<string>group.solutions.pivi.dictus</string>' <<<"$ENTITLEMENTS_XML"; then
              echo "::error::$B still claims the everyday App Group"; exit 1
            fi
          done

          mkdir -p ipa-beta/Payload
          cp -R "$APP" ipa-beta/Payload/
          (cd ipa-beta && zip -qry ../OuisprBeta.ipa Payload)
          ls -lh OuisprBeta.ipa

      - name: Upload OuisprBeta.ipa
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: OuisprBeta-ipa
          path: OuisprBeta.ipa
          retention-days: 30

      # A fixed release whose Ouispr.ipa link never changes, so AltStore on the
      # iPhone can download it directly (artifacts need a GitHub login and come zipped).
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest Ouispr.ipa \
            --title "Ouispr (dernière version)" \
            --notes "Version fabriquée depuis ${GITHUB_SHA::7}. À installer avec AltStore Classic." \
            --target "$GITHUB_SHA"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-build-logs
          path: build/DerivedData/Logs/Build
          retention-days: 7
          if-no-files-found: ignore
